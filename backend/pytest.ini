[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --cov=app.services.auth_service
    --cov=app.core.security
    --cov=app.services.calculation_engine
    --cov=app.services.assessment_service
    --cov-report=term-missing
    --cov-fail-under=90
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
