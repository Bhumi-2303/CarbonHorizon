steps:
# Build frontend with build-time arguments baked into static bundle
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '--build-arg', 'VITE_APP_URL=${_VITE_APP_URL}',
      '--build-arg', 'VITE_API_URL=${_VITE_API_URL}',
      '--build-arg', 'VITE_ANALYTICS_DOMAIN=${_VITE_ANALYTICS_DOMAIN}',
      '--build-arg', 'VITE_TURNSTILE_SITE_KEY=${_VITE_TURNSTILE_SITE_KEY}',
      '-t',
      'gcr.io/$PROJECT_ID/carbonhorizon-frontend',
      '-f',
      'Dockerfile.frontend',
      '.'
    ]

# Build backend
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'gcr.io/$PROJECT_ID/carbonhorizon-backend',
      '-f',
      'Dockerfile.backend',
      '.'
    ]

# Push frontend
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/carbonhorizon-frontend']

# Push backend
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/carbonhorizon-backend']

# Deploy frontend
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy',
      'carbonhorizon-frontend',
      '--image',
      'gcr.io/$PROJECT_ID/carbonhorizon-frontend',
      '--region',
      'asia-south1',
      '--platform',
      'managed',
      '--set-env-vars',
      'BACKEND_URL=${_BACKEND_URL}',
      '--quiet'
    ]

# Deploy backend
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - carbonhorizon-backend
    - --image
    - gcr.io/$PROJECT_ID/carbonhorizon-backend
    - --region
    - asia-south1
    - --platform
    - managed
    - --quiet

images:
  - 'gcr.io/$PROJECT_ID/carbonhorizon-frontend'
  - 'gcr.io/$PROJECT_ID/carbonhorizon-backend'

substitutions:
  _VITE_APP_URL: 'https://carbonhorizon.app'
  _VITE_API_URL: '/api/v1'
  _VITE_ANALYTICS_DOMAIN: 'carbonhorizon.app'
  _VITE_TURNSTILE_SITE_KEY: '0x4AAAAAAAxPlaceholderTurnstileKey'
  _BACKEND_URL: 'https://carbonhorizon-backend-asia-south1.a.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
