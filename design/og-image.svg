<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0e2a22" />
      <stop offset="50%" stop-color="#0b1724" />
      <stop offset="100%" stop-color="#070c14" />
    </radialGradient>

    <!-- Horizon Sun / Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card Glass Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmic / Earth Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Horizon Glow Circles -->
  <circle cx="600" cy="220" r="320" fill="url(#sunGlow)" />
  <circle cx="950" cy="180" r="180" fill="#38bdf8" fill-opacity="0.08" filter="blur(60px)" />
  <circle cx="250" cy="380" r="220" fill="#10b981" fill-opacity="0.12" filter="blur(80px)" />

  <!-- Horizon Wave / Earth Curves -->
  <path d="M-100 520 C 300 440, 700 580, 1300 480 L 1300 630 L -100 630 Z" fill="#04121a" fill-opacity="0.8" />
  <path d="M-100 560 C 400 490, 800 600, 1300 530 L 1300 630 L -100 630 Z" fill="#03080d" />

  <!-- Glowing Horizon Line -->
  <path d="M-50 515 C 320 440, 720 575, 1250 480" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.7" fill="none" />
  <path d="M-50 515 C 320 440, 720 575, 1250 480" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.9" fill="none" />

  <!-- Decorative Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="1100" y1="0" x2="1100" y2="630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Main Card Container (Glassmorphic) -->
  <rect x="150" y="85" width="900" height="460" rx="28" fill="#0b1724" fill-opacity="0.75" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Brand Emblem / Logo Icon -->
  <g transform="translate(600, 175)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="48" fill="#10b981" fill-opacity="0.15" stroke="url(#emeraldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="38" fill="#092019" />
    <!-- Leaf / Horizon Icon -->
    <path d="M-16 12 C -18 -8, 0 -22, 18 -18 C 18 2, 2 16, -16 12 Z" fill="url(#emeraldGrad)" />
    <path d="M-10 8 C -2 -4, 12 -12, 16 -16" stroke="#042f20" stroke-width="2" stroke-linecap="round" />
    <!-- Planet/Horizon Arc -->
    <path d="M-28 6 C -10 -4, 10 -4, 28 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title: Carbon Horizon -->
  <text x="600" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Carbon <tspan fill="url(#emeraldGrad)">Horizon</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Personal Climate Intelligence &amp; AI Sustainability Coach
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 420)">
    <!-- Pill 1: Track Footprint -->
    <rect x="-330" y="-18" width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="-314" cy="0" r="5" fill="#34d399" />
    <text x="-298" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Track Footprint</text>

    <!-- Pill 2: Simulate Scenarios -->
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="-89" cy="0" r="5" fill="#38bdf8" />
    <text x="-73" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Simulate Reductions</text>

    <!-- Pill 3: AI Climate Coach -->
    <rect x="135" y="-18" width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="151" cy="0" r="5" fill="#a78bfa" />
    <text x="167" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">AI Climate Coach</text>
  </g>

  <!-- Bottom Brand URL / Watermark -->
  <text x="600" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="2">
    CARBONHORIZON.APP
  </text>
</svg>
